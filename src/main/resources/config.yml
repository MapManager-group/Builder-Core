#homes/warps可用字符
illegal-characters: ^[A-Za-z][A-Za-z0-9]*$
#开启玩家必须强制阅读用户协议方可进入
agree:
  agreement: false
  url-title: "洛林·方屿服务器用户协议"
  url: "https://xxxxx.xxx.xxx"
#可以返回的位置
backHistory: 5
#用户协议数据库配置
database:
  host: "your_mysql_host:3306"
  #port: 3306
  database: "your_database"
  username: "your_username"
  password: "your_password"
afk:
  threshold: 300 #自动afk时间
  placeholder: "[AFK]" #papi变量